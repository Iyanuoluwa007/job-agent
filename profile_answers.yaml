# ========================================================================
# Profile Answers Policy - Job Agent
# ------------------------------------------------------------------------
# Used by P32c / P33 / P35 for form auto-answering.
# HARD RULE: Any question not covered here MUST be flagged human_review.
#            Never invent answers to policy-sensitive questions.
# File location: /opt/job-agent/job-agent/profile_answers.yaml
# ========================================================================

profile_answers:
  right_to_work_uk: "yes"
  visa_type: "Graduate Visa"
  requires_sponsorship_current: "no"

  requires_sponsorship_future_policy:
    short_term_answer: "no"
    permanent_answer: "yes"
    unknown_answer: "yes"

  role_duration_classification:
    short_term_keywords:
      - "contract"
      - "fixed-term"
      - "fixed term"
      - "3-month"
      - "6-month"
      - "9-month"
      - "12-month"
      - "temporary"
      - "temp role"
      - "temp position"
      - "internship"
      - "intern"
      - "fellow"
      - "fellowship"
      - "graduate programme"
      - "graduate scheme"
    permanent_keywords:
      - "permanent"
      - "full-time permanent"
      - "full time permanent"
      - "perm"

  currently_based: "Manchester, UK"
  open_to_relocation_uk: "yes"
  open_to_relocation_uk_detail: "Open to any UK location"
  preferred_uk_locations:
    - "Manchester"
    - "London"
    - "Remote UK"
  open_to_relocation_international: "no"

  total_years_experience: 5
  skill_years:
    python: 5
    cpp: 3
    c_plus_plus: 3
    machine_learning: 4
    ai: 4
    deep_learning: 4
    robotics: 3
    ros: 2
    ros2: 2

  salary_policy:
    minimum_gbp: 55000
    target_range_gbp: "55000-70000"
    flexible: true
    display_when_asked: "55,000 - 70,000 GBP (flexible, depending on role)"
    prefer_not_to_say_acceptable: true

  notice_period_weeks: 0
  available_start: "immediately"

  previously_interviewed_default: "prefer_not_to_say"
  previously_interviewed_exceptions: []

  skip_if_question_unresolvable: true
  # === PATCH 35C: LLM fallback feature flag ===========================
  # When TRUE, questions that no keyword rule matches will be sent to the
  # LLM cascade (NIM Llama 3.3 fast tier -> Haiku fallback). The LLM picks
  # from the form's actual options only - never invents - and confidence
  # below 0.7 triggers fallback to next model. Default OFF: ship code,
  # dry-run via tests, then flip manually after audit.
  # =====================================================================
  llm_fallback_enabled: true
  # === PATCH 35E: dry-run mode for LLM fallback ===========
  # When TRUE, the LLM cascade still runs and audit log records what
  # the LLM would have answered, but the result is rewritten to
  # skip_unknown before reaching the form. Net: zero LLM-derived
  # answers reach real submissions during dry-run.
  # ========================================================
  llm_fallback_dry_run: true
  max_form_human_review_per_day: 5
  log_every_answered_question: true

  # === Extended profile for LLM-fallback context (P35B) =========
  # Read by _llm_answer_question alongside resume_text. Edit any value
  # you disagree with - this file is your source of truth.
  # ===============================================================

  leadership:
